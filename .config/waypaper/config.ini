[Settings]
language = en
folder = ~/Pictures/wallpaper
wallpaper = ~/Pictures/wallpaper/green.png
backend = swww
monitors = All
fill = fill
sort = date
color = #ffffff
subfolders = True
show_hidden = False
show_gifs_only = False
post_command = yad --title="主题选择" --text="🌈 Color schemes" --button="Light:0" --button="Dark:1" && (matugen image $wallpaper -m "light" && gsettings set org.gnome.desktop.interface color-scheme prefer-light) || (matugen image $wallpaper && gsettings set org.gnome.desktop.interface color-scheme prefer-dark)
number_of_columns = 3
swww_transition_type = center
swww_transition_step = 90
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
use_xdg_state = False
show_transition_options = True
all_subfolders = True
mpvpaper_sound = False
mpvpaper_timer = 600
mpvpaper_options = 
show_path_in_tooltip = True

